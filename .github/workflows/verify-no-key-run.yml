name: Verify No-Key Run

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prep test input/output dirs
        run: |
          mkdir -p input output
          cat > input/tasks.json << 'EOF'
          [
            {
              "task_id": "verify-01",
              "video_url": "https://storage.googleapis.com/amd-hackathon-clips/1860079-uhd_2560_1440_25fps.mp4",
              "styles": ["formal", "sarcastic"]
            }
          ]
          EOF

      - name: Run container with NO injected key
        run: |
          docker run --rm \
            -v "$(pwd)/input:/input" \
            -v "$(pwd)/output:/output" \
            ghcr.io/${{ github.repository_owner }}/video-caption-agent:latest

      - name: Show results
        run: cat output/results.json
